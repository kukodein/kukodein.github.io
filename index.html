<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
	<title>Kukode Lab for Tools & Playground For Free</title>
	<meta name="title" content="Kukode Lab for Tools & Playground For Free" />
	<meta name="description" content="Explore a variety of online tools and interactive playgrounds, including CSS flexbox playgrounds, to enhance your web development skills." />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://lab.kukode.com/" />
	<meta property="og:title" content="Kukode Lab for Tools & Playground For Free" />
	<meta property="og:description" content="Explore a variety of online tools and interactive playgrounds, including CSS flexbox playgrounds, to enhance your web development skills." />
	<meta property="og:image" content="assets/image/featured-image.jpg" />

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image" />
	<meta property="twitter:url" content="https://lab.kukode.com/" />
	<meta property="twitter:title" content="Kukode Lab for Tools & Playground For Free" />
	<meta property="twitter:description" content="Explore a variety of online tools and interactive playgrounds, including CSS flexbox playgrounds, to enhance your web development skills." />
	<meta property="twitter:image" content="assets/image/featured-image.jpg" />

  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="canonical" href="https://lab.kukode.com/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="alternate" hreflang="id" href="https://lab.kukode.com/" />
  <link rel="alternate" hreflang="x-default" href="https://lab.kukode.com/" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --text: #e8eaf6;
      --text-muted: #8b90b0;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --accent-soft: rgba(108, 99, 255, 0.15);
      --cat-bg: #22263a;
      --cat-active-bg: #6c63ff;
      --cat-active-text: #fff;
      --search-bg: #1a1d27;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.35);
      --icon-bg: #2e3250;
    }
    [data-theme="light"] {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface2: #f0f1fa;
      --border: #d8daf0;
      --text: #1a1d2e;
      --text-muted: #6b6f8e;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --accent-soft: rgba(108, 99, 255, 0.1);
      --cat-bg: #e8e9f8;
      --cat-active-bg: #6c63ff;
      --cat-active-text: #fff;
      --search-bg: #ffffff;
      --card-shadow: 0 4px 20px rgba(108,99,255,0.08);
      --icon-bg: #eeeffc;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 0 12px;
      backdrop-filter: blur(12px);
      transition: background 0.3s, border-color 0.3s;
    }
    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    /* Theme Toggle */
    .theme-toggle {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* Search */
    .search-wrap { position: relative; }
    .search-wrap .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; font-size: 0.95rem;
    }
    .search-input {
      width: 100%;
      background: var(--search-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 16px 10px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Category Pills */
    .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-pill {
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--cat-bg);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.18s;
      user-select: none;
      white-space: nowrap;
    }
    .cat-pill:hover { border-color: var(--accent); color: var(--accent); }
    .cat-pill.active {
      background: var(--cat-active-bg);
      color: var(--cat-active-text);
      border-color: var(--cat-active-bg);
    }

    /* App Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }
    @media (max-width: 1200px) { .app-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 768px)  { .app-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 480px)  { .app-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

    /* App Card */
    .app-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 18px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      box-shadow: var(--card-shadow);
      gap: 10px;
    }
    .app-card.no-link {
      cursor: default;
    }
    .app-card:not(.no-link):hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(108,99,255,0.2);
      color: var(--text);
    }
    .app-card.no-link:hover {
      color: var(--text);
    }

    .app-icon-wrap {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--icon-bg);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .app-icon-wrap img {
      width: 100%; height: 100%; object-fit: cover; padding: 5px;
    }
    .app-icon-emoji {
      font-size: 1.8rem;
      line-height: 1;
    }

    .app-name {
      font-weight: 600;
      font-size: 0.85rem;
      line-height: 1.3;
      color: var(--text);
    }
    .app-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Coming Soon Badge */
    .badge-soon {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      letter-spacing: 0.03em;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .empty-emoji { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    /* Sort Group */
    .sort-group { display: flex; gap: 6px; }
    .sort-btn {
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--cat-bg);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Results Count */
    .results-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Animations */
    .app-card { animation: fadeUp 0.3s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top Spacer */
    .top-spacer { height: 32px; }
    @media (max-width: 480px) { .top-spacer { height: 20px; } }

    /* Loading State */
    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Footer */
    .app-footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      margin-top: 48px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: border-color 0.3s;
    }
    .app-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .app-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="top-spacer"></div>

<!-- Header -->
<header class="app-header">
  <div class="container-xl px-3 px-md-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <h1 class="app-title mb-0 flex-grow-1">APP DIRECTORY</h1>
      <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">🌙</button>
    </div>
    <!-- Search -->
    <div class="search-wrap mb-3">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search apps..." autocomplete="off" autofocus />
    </div>
    <!-- Category Pills -->
    <div class="cat-pills" id="catPills"></div>
  </div>
</header>

<!-- Main Content -->
<main class="container-xl px-3 px-md-4 py-4">
  <div class="d-flex align-items-center justify-content-between mb-3 gap-2 flex-wrap">
    <span class="results-count" id="resultsCount"></span>
    <div class="sort-group" id="sortGroup">
      <button class="sort-btn active" data-sort="default">Default</button>
      <button class="sort-btn" data-sort="az">A ⇾ Z</button>
      <button class="sort-btn" data-sort="za">Z ⇾ A</button>
    </div>
  </div>
  <div class="app-grid" id="appGrid">
    <div class="loading-state">Loading apps...</div>
  </div>
</main>

<!-- Footer -->
<footer class="app-footer">
  <div class="container-xl px-3 px-md-4">
    <span>© <span id="footerYear"></span> <a href="https://kukode.com" target="_blank" rel="noopener">kukode.com</a> — All rights reserved.</span>
  </div>
</footer>

<script>
const DEFAULT_EMOJI = "🗂️";
let apps = [];
let activeCategories = new Set(["All"]);
let searchQuery = "";
let sortMode = "default";

// Load data from data.json
fetch("./data.json")
  .then(res => {
    if (!res.ok) throw new Error("Failed to load data.json");
    return res.json();
  })
  .then(data => {
    apps = data;
    buildCategoryPills();
    renderApps();
  })
  .catch(err => {
    document.getElementById("appGrid").innerHTML = `
      <div class="empty-state">
        <div class="empty-emoji">⚠️</div>
        <p>Could not load app data. Make sure <strong>data.json</strong> is in the same folder as this file.</p>
      </div>`;
    console.error(err);
  });

// Build Category Pills
function buildCategoryPills() {
  const allCategories = ["All", ...new Set(apps.flatMap(a => Array.isArray(a.category) ? a.category : [a.category]))];
  const catPillsEl = document.getElementById("catPills");
  catPillsEl.innerHTML = "";

  allCategories.forEach(cat => {
    const pill = document.createElement("button");
    pill.className = "cat-pill" + (cat === "All" ? " active" : "");
    pill.textContent = cat;
    pill.dataset.cat = cat;
    pill.addEventListener("click", () => toggleCategory(cat, pill));
    catPillsEl.appendChild(pill);
  });
}

function toggleCategory(cat, pillEl) {
  if (cat === "All") {
    activeCategories = new Set(["All"]);
    document.querySelectorAll(".cat-pill").forEach(p => p.classList.remove("active"));
    pillEl.classList.add("active");
  } else {
    activeCategories.delete("All");
    document.querySelector('[data-cat="All"]').classList.remove("active");

    if (activeCategories.has(cat)) {
      activeCategories.delete(cat);
      pillEl.classList.remove("active");
    } else {
      activeCategories.add(cat);
      pillEl.classList.add("active");
    }

    if (activeCategories.size === 0) {
      activeCategories.add("All");
      document.querySelector('[data-cat="All"]').classList.add("active");
    }
  }
  renderApps();
}

// Search
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderApps();
});

// Sort
document.getElementById("sortGroup").addEventListener("click", e => {
  const btn = e.target.closest(".sort-btn");
  if (!btn) return;
  sortMode = btn.dataset.sort;
  document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderApps();
});

// Render Apps
function renderApps() {
  const grid = document.getElementById("appGrid");
  const countEl = document.getElementById("resultsCount");

  const filtered = apps.filter(app => {
    const appCats = Array.isArray(app.category) ? app.category : [app.category];
    const matchCat = activeCategories.has("All") || appCats.some(c => activeCategories.has(c));
    const matchSearch = !searchQuery ||
      app.name.toLowerCase().includes(searchQuery) ||
      app.desc.toLowerCase().includes(searchQuery) ||
      appCats.some(c => c.toLowerCase().includes(searchQuery));
    return matchCat && matchSearch;
  });

  countEl.textContent = `Showing ${filtered.length} app${filtered.length !== 1 ? "s" : ""}`;

  if (sortMode === "az") filtered.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortMode === "za") filtered.sort((a, b) => b.name.localeCompare(a.name));

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-emoji">🔍</div>
        <p>No apps found matching "<strong>${searchQuery}</strong>"</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map((app, i) => {
    const iconHtml = app.image
      ? `<img src="${app.image}" alt="${app.name}" loading="lazy" />`
      : `<span class="app-icon-emoji">${app.emoji || DEFAULT_EMOJI}</span>`;

    const hasLink = app.url && app.url !== "#";
    const tag = hasLink ? "a" : "div";
    const linkAttrs = hasLink
      ? `href="${app.url}" target="_blank" rel="noopener"`
      : "";
    const noLinkClass = hasLink ? "" : " no-link";
    const badge = hasLink ? "" : `<span class="badge-soon">Coming Soon</span>`;

    return `
      <${tag} ${linkAttrs} class="app-card${noLinkClass}" style="animation-delay:${i * 0.03}s">
        <div class="app-icon-wrap">${iconHtml}</div>
        <div class="app-name">${app.name}</div>
        <div class="app-desc">${app.desc}</div>
        ${badge}
      </${tag}>`;
  }).join("");
}

// Dark / Light Toggle
const themeToggle = document.getElementById("themeToggle");
const html = document.documentElement;

function setTheme(theme) {
  html.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "🌙" : "☀️";
  localStorage.setItem("theme", theme);
}

themeToggle.addEventListener("click", () => {
  setTheme(html.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme);

// Footer Year
document.getElementById("footerYear").textContent = new Date().getFullYear();
</script>
</body>
</html>
